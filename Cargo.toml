[package]
name = "llm-ctl"
version = "2.0.0"
edition = "2021"
description = "Linux CLI for local LLM lifecycle management and Ollama orchestration"
license = "MIT"
repository = "https://github.com/roninscript30/llm-ctl"
readme = "README.md"
keywords = ["llm", "ollama", "cli", "linux"]
categories = ["command-line-utilities"]

[[bin]]
name = "llm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
