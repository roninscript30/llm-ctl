name: Linux release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package binary
        run: tar -czf llm-ctl-linux-x86_64.tar.gz -C target/release llm
      - uses: softprops/action-gh-release@v2
        with:
          files: llm-ctl-linux-x86_64.tar.gz
